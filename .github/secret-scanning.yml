# Custom secret-scanning patterns — jolarca-consent
#
# policy/compliance-gates.yml#secret_scan.implementation.custom_patterns declares
# a marketplace API-key pattern. GitHub only honours it when
# secret_scanning_non_provider_patterns is ENABLED on the repository.
#
# Audit finding (2026-09-28): PATCHing that flag returned HTTP 200 but the value
# stayed "disabled" — it requires GitHub Advanced Security, which the Free plan
# does not provide. This file is committed so the control is declarative and
# becomes live the moment the plan allows it; until then the custom pattern is
# INERT and must not be cited as an active mitigation. Track it as a dated risk
# acceptance in policy/compliance-gates.yml#exceptions.active (the D-07 pattern,
# with `blocked_by: plan tier`).

patterns:
  - pattern:
      regex: "jolarca_(live|test)_[a-zA-Z0-9]{32,}"
      confidence: high
