name: Security

# Audit finding A-01/L-20 (2026-09-28): this workflow triggered on `schedule`
# and `workflow_dispatch` ONLY. repos/jolarca-consent.yml declares it as a
# required pre-merge status check, and a check that cannot fire on a pull
# request can never gate one — every PR would block forever while the control
# looked fully configured. `pull_request` is therefore mandatory here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly on Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # 2026-10-27 (D-90): this step used gitleaks/gitleaks-action, which now requires a
      # PAID license; consent has no GITLEAKS_LICENSE secret (`gh secret list` -> none), so the
      # job could never go green -- and the branch ruleset requires this context, so every PR in
      # the repository was blocked. The gitleaks CLI is free and does the same scan.
      #
      # Kept from the original comment (A-02/L-21a): a fabricated action SHA passes review and
      # fails at runtime. The checksum below is taken from the release's own
      # gitleaks_8.30.1_checksums.txt, and the install refuses on mismatch -- `curl | tar` with no
      # verification (as compliance-scan.yml in jolarca-control still does) is the weaker pattern.
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          set -euo pipefail
          GL_VERSION="8.30.1"
          ASSET="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/${ASSET}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${ASSET}" | sha256sum --check --strict
          tar xzf "${ASSET}" gitleaks
          sudo install gitleaks /usr/local/bin
          gitleaks version

      # Negative control, before the real scan. "no leaks found" is worthless if the scanner
      # loaded zero rules (a bad .gitleaks.toml [extend] resolves to an empty ruleset and the
      # job goes green while blind). Plant a credential-shaped value assembled at runtime from
      # two halves -- so no literal secret appears in a tracked file -- and FAIL if gitleaks
      # does not detect it. Pattern copied from jolarca-compliance's security.yml.
      - name: Negative control (the scanner must find a planted secret)
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          printf '%s%s\n' 'ghp_' '1234567890abcdefghij1234567890abcdefghij' > "$T/fixture.txt"
          if gitleaks dir "$T" --no-banner --redact > /dev/null 2>&1; then
            echo "::error::NEGATIVE CONTROL FAILED -- gitleaks detected nothing in a planted fixture;" \
                 "the scan would be a false pass. Not running the real scan."
            rm -rf "$T"; exit 1
          fi
          rm -rf "$T"
          echo "negative control ok: planted fixture was detected"

      # Real scan: full history (fetch-depth: 0 above) and the working tree.
      # Measured locally on consent's history before this change was proposed:
      #   gitleaks git . -> "9 commits scanned", "no leaks found", exit 0
      - name: Run gitleaks (full history)
        run: gitleaks git . --no-banner --redact
      - name: Run gitleaks (working tree)
        run: gitleaks dir . --no-banner --redact

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Audit finding A-08/L-21b (2026-09-28): was `@v4`, a mutable tag that can
      # be force-moved, and carried no licence policy. policy/compliance-gates.yml
      # #dependency_scan mandates this exact SHA (v5.0.0, verified to resolve) with
      # fail_on_severity moderate and deny_licenses GPL/AGPL/SSPL.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0
