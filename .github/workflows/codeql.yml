name: CodeQL

# Audit finding A-06 (2026-09-28): policy/compliance-gates.yml#sast is
# `enforcement: mandatory` and enforcement_matrix.platform.required includes it,
# so a tier: platform repo must run CodeQL. GET /code-scanning/analyses returned
# HTTP 404 "no analysis found" — the gate had never run. CodeQL is free on public
# repositories, so the Free-plan tier is not a defence here.
#
# Job `name:` values ARE the required status-check contexts GitHub reports. Keep
# them stable and keep repos/jolarca-consent.yml#branch_protection.main
# .required_status_checks.contexts in sync, or the protection rule becomes
# unsatisfiable and blocks every merge (finding L-19).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly on Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA below is the verified dereference of the annotated tag v3 (v3.38.2).
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          # policy/compliance-gates.yml#sast declares queries: security-extended
          queries: security-extended
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: "/language:python"
