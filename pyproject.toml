# ──────────────────────────────────────────────────────────────────────────────
# Tool configuration — jolarca-consent
# ──────────────────────────────────────────────────────────────────────────────
# CONTRIBUTING.md requires "ruff check" and "mypy --strict". This file pins
# the selection so the documented standard is reproducible and enforceable
# (ISO 27001 A.8.9 / A.8.25).
# ──────────────────────────────────────────────────────────────────────────────

[project]
name = "jolarca-consent"
version = "0.1.0"
description = "Independent consent registry of record (GDPR / ISO 27001 / SOC 2 aligned)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — all rights reserved" }
dependencies = [
    "Django>=5.2,<6.2",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "django-stubs>=5.0",
]
prod = [
    "gunicorn>=22.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["consent_registry", "consent_integrity", "project"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Explicit selection — do not rely on ruff's version-dependent defaults.
select = [
  "E4",   # pycodestyle imports
  "E7",   # pycodestyle statements
  "E9",   # pycodestyle errors (syntax/undefined names)
  "F",    # pyflakes
  "I",    # isort
  "SIM",  # flake8-simplify
  "ISC",  # flake8-implicit-str-concat
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "RUF",  # ruff-specific
  "S",    # flake8-bandit (security)
  "DJ",   # django-specific
]
ignore = [
  # Long compliance prose in docstrings/comments is deliberate; E501 is not
  # selected above.
  "RUF012",  # mutable class defaults — not used, but records intent
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101", "DJ"]
"**/settings/*" = ["S105", "S106"]  # settings legitimately name secret vars

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
# Audit finding A-11 (2026-09-28): `files` was ["main.py", "scripts"], so the CI
# job named "Type check (mypy)" reported green while type-checking 3 of 28 Python
# files. The two modules whose correctness IS the compliance guarantee — the
# consent registry of record (ADR-0001) and the SHA-256 append-only chain
# (ADR-0002) — were excluded entirely.
#
# Both are now in scope and both pass strict mypy with zero errors (verified
# 2026-09-28; models.py needed two missing annotations, now added). The
# remaining exclusions are a MEASURED deferral, not an assumption: views,
# serializers, admin and tests raise 74 further strict errors, 8 of them
# "cannot subclass (has type Any)" that djangorestframework-stubs (3.18.1,
# available) would clear. Widening before adding that dependency would turn CI
# red on the very first commit. Tracked as a follow-up, not silently dropped.
files = [
    "main.py",
    "scripts",
    "consent_registry/models.py",
    "consent_integrity/hash_chain.py",
]
warn_unreachable = true
disallow_any_explicit = false
exclude = ["migrations", "project", "tests"]

[tool.django-stubs]
django_settings_module = "project.settings.dev"

[[tool.mypy.overrides]]
module = ["yaml.*", "rest_framework.*", "drf_spectacular.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
omit = ["*/tests/*", "main.py", "*/migrations/*"]
